services:
  - type: web
    name: growth-gradual-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEYS
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: EXA_API_KEY_2
        sync: false
      - key: EXA_API_KEY_3
        sync: false
      - key: WEB_SEARCH_PROVIDER
        value: exa
      - key: GEMINI_API_KEY
        sync: false
      # Gemini quotas are per Google Cloud project (docs/CONFIGURATION.md section 1); optional
      - key: GG_GEMINI_KEY_PROJECTS
        sync: false
      - key: GG_GEMINI_QUOTAS
        sync: false
      # data.gov.in connector: off unless both are set (docs/CONFIGURATION.md section 6)
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: GG_DATAGOV_RESOURCES
        sync: false
      - key: LOGO_B64
        sync: false   # optional: base64-encoded logo image bytes
